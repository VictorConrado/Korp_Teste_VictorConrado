<div class="aplicacao">

  <aside class="menu-lateral">

    <div class="logo">
      <span class="logo-icone">K</span>

      <div>
        <strong>Korp</strong>
        <small>Gestão</small>
      </div>
    </div>

    <nav class="navegacao">

      <a routerLink="/" routerLinkActive="ativo"
         [routerLinkActiveOptions]="{ exact: true }">
        <span>⌂</span>
        Início
      </a>

      <a routerLink="/produtos" routerLinkActive="ativo">
        <span>▦</span>
        Produtos
      </a>

      <a routerLink="/notas-fiscais" routerLinkActive="ativo">
        <span>▤</span>
        Notas fiscais
      </a>

    </nav>

    <div class="rodape-menu">
      <span>Processo seletivo</span>
      <small>Korp • 2026</small>
    </div>

  </aside>

  <main class="conteudo">
    <header class="barra-superior">
      <div>
        <span class="titulo-sistema">Gestão de estoque e faturamento</span>
      </div>
    </header>

    <section class="area-conteudo">
      <router-outlet></router-outlet>
    </section>
  </main>

</div>
